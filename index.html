<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Media Player</title>
    <!-- Must be first: registers a service worker that adds COOP/COEP headers,
         enabling SharedArrayBuffer which ffmpeg.wasm requires. On first load
         it triggers one automatic page reload to activate the worker. -->
    <script src="coi-serviceworker.js"></script>
    <script src="vendor/ffmpeg/ffmpeg.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="media-container">
      <video id="videoPlayer" controls tabindex="0"></video>
      <audio id="audioPlayer" controls hidden tabindex="0"></audio>

      <div class="waveform-container">
        <canvas id="waveform"></canvas>
        <canvas id="progressOverlay"></canvas>
      </div>

      <input
        type="file"
        id="fileInput"
        class="file-input-native"
        accept="video/*,audio/*,.3gp,.3gpp,.3g2,audio/3gpp,video/3gpp,audio/3gpp2,video/3gpp2"
        multiple
      />

      <div
        class="queue-container"
        id="queueContainer"
        tabindex="0"
        aria-label="Open file chooser"
        title="Click to choose files"
      >
        <div class="queue-control-row">
          <div class="queue-actions">
            <h3>Queue <span id="queueCount" class="queue-count" aria-label="0 files in queue">0</span></h3>
            <button type="button" id="newQueueButton" class="new-queue-button">New queue</button>
            <button
              type="button"
              id="reverseQueueButton"
              class="reverse-queue-button"
              aria-label="Reverse queue order"
              title="Reverse queue order"
              disabled
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M8 20V4m-4 4 4-4 4 4M16 4v16m-4-4 4 4 4-4" />
              </svg>
            </button>
          </div>
          <div class="queue-controls">
            <div class="speed-control">
              <label for="speedControl">Speed:</label>
              <input
                type="number"
                id="speedControl"
                min="0.1"
                max="100"
                step="0.1"
                value="1.0"
              />
            </div>
            <button
              type="button"
              id="repeatButton"
              class="repeat-button"
              aria-pressed="false"
              aria-label="Repeat is off"
              title="Repeat is off"
            >
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m17 2 4 4-4 4" />
                <path d="M3 11V9a3 3 0 0 1 3-3h15" />
                <path d="m7 22-4-4 4-4" />
                <path d="M21 13v2a3 3 0 0 1-3 3H3" />
                <text
                  class="repeat-one-marker"
                  x="12"
                  y="15"
                  fill="currentColor"
                  stroke="none"
                  text-anchor="middle"
                  font-size="8"
                  font-weight="700"
                >1</text>
                <circle class="repeat-active-dot" cx="12" cy="22" r="1.8" fill="currentColor" stroke="none" />
              </svg>
            </button>
          </div>
        </div>
        <p id="sessionStatus" class="session-status" role="status" aria-live="polite"></p>
        <details class="saved-queues" id="savedQueues" hidden>
          <summary id="savedQueuesSummary">Saved queues</summary>
          <ul id="savedQueuesList" class="saved-queues-list"></ul>
        </details>
        <details class="queue-restore" id="queueRestore" hidden>
          <summary title="Expand or collapse saved files" id="queueRestoreSummary">Saved files to restore</summary>
          <div class="queue-restore-controls">
            <button type="button" id="restoreQueueButton">Restore queue</button>
            <button type="button" id="relinkQueueButton">Reselect files</button>
            <span id="queueRestoreStatus" role="status" aria-live="polite"></span>
          </div>
          <ul class="queue-list" id="queueRestoreList" aria-label="Saved files requiring access"></ul>
        </details>
        <ul class="queue-list" id="queueList">
          <li class="queue-empty">
            No files in queue. Select files or drop them onto the page to queue them.
          </li>
        </ul>
      </div>
    </div>

    <script src="position-store.js"></script>
    <script src="queue-sessions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
